<svg xmlns="http://www.w3.org/2000/svg" width="284" height="184" viewBox="0 0 284 184" role="img" aria-label="BUILD — Workflows"><title>BUILD — Workflows</title><style>text{font-family:system-ui,sans-serif} .serif{font-family:Georgia,'Times New Roman',serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.rise{animation:rise .68s cubic-bezier(.22,.68,.23,1) var(--d,0s) both}.row{animation:reveal .34s linear var(--d,0s) both}.cell{transform-box:fill-box;transform-origin:center;animation:pop .43s ease-out var(--d,0s) both}.bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .65s cubic-bezier(.23,.8,.3,1) var(--d,0s) both}.tile{animation:rise .8s cubic-bezier(.2,.78,.24,1) var(--d,0s) both}.sweep{animation:sweep 4.8s ease-in-out 1.25s 2 both}
@keyframes reveal{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes pop{0%{opacity:0;transform:scale(.25)}64%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}@keyframes grow{from{transform:scaleY(.001)}to{transform:scaleY(1)}}@keyframes sweep{0%,55%{opacity:0;transform:translateX(-165px)}62%{opacity:.35}85%,100%{opacity:0;transform:translateX(340px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.sweep{display:none}}</style><g class="tile" style="--d:2.7s"><rect x="0" y="0" width="284" height="184" rx="17" fill="#2f55ff" /><text x="19" y="33" font-size="13" fill="#ffffff" class="mono" style="--d:0.000s" letter-spacing="1.8">BUILD</text><text x="266" y="33" font-size="13" fill="#ffffff" class="mono" style="--d:0.000s" text-anchor="end">01</text><text x="19" y="97" font-size="39" fill="#ffffff" class="serif" style="--d:0.000s" >Workflows</text><text x="20" y="148" font-size="13" fill="#ffffff" class="" style="--d:0.000s" >From booking to payment</text><text x="248" y="147" font-size="23" fill="#ffffff" class="" style="--d:0.000s" >↗</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="284" height="124" viewBox="0 0 284 124" role="img" aria-label="Booking &amp; payments — AI booking via LINE"><title>Booking &amp; payments — AI booking via LINE</title><style>text{font-family:system-ui,sans-serif} .serif{font-family:Georgia,'Times New Roman',serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.rise{animation:rise .68s cubic-bezier(.22,.68,.23,1) var(--d,0s) both}.row{animation:reveal .34s linear var(--d,0s) both}.cell{transform-box:fill-box;transform-origin:center;animation:pop .43s ease-out var(--d,0s) both}.bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .65s cubic-bezier(.23,.8,.3,1) var(--d,0s) both}.tile{animation:rise .8s cubic-bezier(.2,.78,.24,1) var(--d,0s) both}.sweep{animation:sweep 4.8s ease-in-out 1.25s 2 both}
@keyframes reveal{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes pop{0%{opacity:0;transform:scale(.25)}64%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}@keyframes grow{from{transform:scaleY(.001)}to{transform:scaleY(1)}}@keyframes sweep{0%,55%{opacity:0;transform:translateX(-165px)}62%{opacity:.35}85%,100%{opacity:0;transform:translateX(340px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.sweep{display:none}}</style><g class="tile" style="--d:3.45s"><rect x="0" y="0" width="284" height="124" rx="14" fill="#f3f3f1" /><circle cx="20" cy="28" r="3.75" fill="#2f55ff"/><text x="32" y="34" font-size="17" fill="#111111" class="" style="--d:0.000s" font-weight="650">Booking &amp; payments</text><text x="17" y="63" font-size="13" fill="#3a3a3c" class="" style="--d:0.000s" >AI booking via LINE</text><text x="17" y="100" font-size="11" fill="#5c5c64" class="mono" style="--d:0.000s" >Node.js  /  Stripe</text></g></svg>